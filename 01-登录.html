<!doctype html>
<html lang="zh-CN" data-theme-lock>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="img/logo-icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
<title>风之岚 OS · 登录</title>
<!-- P01 登录：账号密码登录（Better Auth），账号由管理员建，不开放自助注册。企业微信扫码登录也在首期（按 userid 对应成员）。 -->
<link rel="stylesheet" href="assets/tokens.css">
<script src="assets/theme.js"></script>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/components.css">
<link rel="stylesheet" href="assets/topbar.css">
<style>
  body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg-0) url(img/login-bg.webp) center/cover no-repeat}
  body::before{content:"";position:fixed;inset:0;background:radial-gradient(60% 60% at 50% 45%,transparent,rgb(var(--rgb-deep) / .75));pointer-events:none}
  .box{position:relative;width:100%;max-width:400px;padding:var(--sp-6);border-radius:var(--r-pop);background:rgb(var(--rgb-deep) / .86);border:1px solid var(--border);box-shadow:var(--shadow-pop);backdrop-filter:blur(18px);animation:enter var(--t-number) var(--ease) both}
  .logo{display:flex;align-items:center;gap:12px;margin-bottom:var(--sp-5)}
  .logo img{width:44px;height:44px}
  .logo b{font-family:var(--font-serif);font-size:var(--fs-24);letter-spacing:.06em}
  .logo small{display:block;font-size:var(--fs-12);color:var(--text-3);letter-spacing:.1em;margin-top:2px}
  h1{font-size:var(--fs-20);margin-bottom:4px}
  .lead{font-size:var(--fs-13);color:var(--text-2);margin-bottom:var(--sp-5)}
  .foot{font-size:var(--fs-12);color:var(--text-3);margin-top:var(--sp-4);text-align:center} .foot.fine{margin-top:var(--sp-2);font-size:var(--fs-11);opacity:.7}
  .err{display:none;font-size:var(--fs-12);color:var(--error);margin-top:-8px;margin-bottom:var(--sp-3)}
  .box.bad .err{display:block} .box.bad .input{border-color:var(--error)}
</style>
</head>
<body>
<form class="box" id="f" novalidate>
  <div class="logo"><img src="img/logo-icon.svg" alt=""><div><b>风之岚 OS</b><small>AI 员工和团队一起干活</small></div></div>
  <h1>登录</h1><p class="lead">演示账号已填好，点「登录」即可进入组织树。</p>
  <div class="field"><label for="email">工作邮箱</label><input class="input" id="email" type="email" autocomplete="off" value="demo@example.com"></div>
  <div class="field"><label for="pw">密码</label><input class="input" id="pw" type="password" autocomplete="off" value="preview"></div>
  <p class="err" id="err" role="alert">邮箱或密码不对。忘了密码找决策层或主管重置。</p>
  <button class="btn main block lg" id="go">登录</button>
  <div style="display:flex;align-items:center;gap:10px;margin:var(--sp-4) 0 var(--sp-3);font-size:var(--fs-12);color:var(--text-3)"><span style="flex:1;height:1px;background:var(--divider)"></span>或者<span style="flex:1;height:1px;background:var(--divider)"></span></div>
  <button type="button" class="btn block lg" id="wx"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>企业微信扫码登录</button>
  <p class="foot">登录后决策层、主管先看到组织树，运营先看到「待我处理」。</p>
  <p class="foot fine">本系统使用 MiSans 字体</p>
</form>
<div class="toasts" aria-live="polite"></div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
  const {$} = OS;
  $('#wx').onclick = () => OS.toast('请用企业微信扫码', '演示：上线后这里弹出二维码，扫完直接进。');
  $('#f').onsubmit = e => { e.preventDefault(); const bad = !/@/.test($('#email').value) || !$('#pw').value; $('#f').classList.toggle('bad', bad); if (!bad) location.href = '03-组织树.html'; };
</script>
</body>
</html>
