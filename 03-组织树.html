<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="img/logo-icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
<title>风之岚 OS 组织树</title>
<!--
  P03 组织树（决策层首页），数字都是假的。
  主画面只放结果：本周生意（总数只出现这一次）→ 小巡一句话 → 各中心 → 店铺（各自的数）→ 要处理的事。
  点任何一处，右侧滑出完整信息。部门统一叫「中心」（2026-11-22 定）。
  数据来自店铺官方接口（AI 员工直接取）；拍板后由 AI 员工通过接口执行。没接入的中心显示「未接入」，不估算。
  小巡每天 15:00 出日报，每小时巡查 AI 员工和店铺数据，紧急的事用企业微信直接通知这件事的拍板人，拍板人在通知里就能批准。
  这一页是决策层的视角（顶部节点写「等你」）；主管、运营登录时顶部节点写「等决策层 N 件」，自己要定的事在「等你拍板」/「待我处理」里。
-->
<link rel="stylesheet" href="assets/tokens.css">
<script src="assets/theme.js"></script>
<link rel="stylesheet" href="assets/topbar.css">
<style>
  /* 设计变量见 assets/tokens.css */
  *{box-sizing:border-box}
  html{background:var(--bg-0)}
  body{margin:0;min-height:100vh;color:var(--text-1);overflow-x:hidden;
    font:14px/1.5 -apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;
    background:radial-gradient(70% 45% at 50% 0%,rgba(242,181,68,.07),transparent 70%),radial-gradient(120% 80% at 50% 100%,rgba(11,22,48,.55),transparent 70%),var(--bg-0)}
  .num{font-variant-numeric:tabular-nums;letter-spacing:.01em}
  /* 背景：顶部的光缓慢漂移，画面一直有呼吸感 */
  body::before{content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;
    background:radial-gradient(28% 22% at 42% 12%,rgba(242,181,68,.11),transparent 70%),radial-gradient(22% 18% at 64% 18%,rgba(127,209,199,.05),transparent 70%),
      radial-gradient(24% 20% at 30% 34%,rgba(229,139,176,.035),transparent 70%);animation:aurora 26s ease-in-out infinite alternate}
  @keyframes aurora{to{transform:translate(5%,3%) rotate(5deg)}}
  /* 卡片跟手光 */
  .boss::after,.hub::after,.store::after,.worker::after,.member::after,.ceo::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity var(--t-enter);
    background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(250,203,131,.09),transparent 60%)}
  .boss:hover::after,.member:hover::after,.hub:hover::after,.store:hover::after,.worker:hover::after,.ceo:hover::after{opacity:1}
  .spk{stroke-dasharray:1;stroke-dashoffset:1;animation:spk var(--t-slow) var(--ease) var(--t-number) forwards}
  @keyframes spk{to{stroke-dashoffset:0}}
  .reveal{animation:reveal .9s var(--ease)}
  @keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
  body.open .dw-b>*{animation:rise var(--t-enter) var(--ease) both}
  body.open .dw-b>*:nth-child(2){animation-delay:.05s} body.open .dw-b>*:nth-child(3){animation-delay:.1s} body.open .dw-b>*:nth-child(4){animation-delay:var(--t-hover)} body.open .dw-b>*:nth-child(n+5){animation-delay:var(--t-panel)}
  @keyframes rise{from{opacity:0;translate:0 8px}}
  .rip{fill:none;stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:rip var(--t-number) ease-out forwards}
  @keyframes rip{from{transform:scale(.4);opacity:.9}to{transform:scale(3.2);opacity:0}}
  :focus{outline:none}
  a:focus-visible,button:focus-visible,[data-node]:focus-visible{outline:2px solid var(--brand-hi);outline-offset:3px}
  .up{color:var(--ok)} .muted{color:var(--text-3)}
  .na{display:inline-flex;align-items:center;font-size:11px;font-weight:400;color:var(--text-3);border:1px dashed rgba(139,149,176,.45);border-radius:99px;padding:0 7px;white-space:nowrap}

  /* ---------- 顶栏：与地图演示一致 ---------- */
  header{position:sticky;top:16px;z-index:30;display:flex;align-items:center;gap:16px;margin:16px 20px 0;padding:10px 14px 10px 18px;
    border-radius:18px;background:rgb(var(--rgb-deep) / .78);border:1px solid var(--border);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3)}
  .brand{display:flex;align-items:baseline;gap:8px;font:700 18px/1 "Noto Serif SC","Songti SC",serif;letter-spacing:.1em;white-space:nowrap}
  .brand small{font:600 11px/1 -apple-system,sans-serif;letter-spacing:.36em;color:var(--brand)}
  .seg{display:flex;padding:3px;border-radius:12px;background:rgb(var(--rgb-tint) / .06)}
  .seg a,.seg button{all:unset;padding:5px 12px;border-radius:9px;color:var(--text-2);cursor:pointer;font-size:13px;white-space:nowrap}
  .seg .on{background:rgb(var(--rgb-tint) / .12);color:var(--text-1)}
  .spacer{flex:1}
  .stat{display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:13px;white-space:nowrap}
  .stat b{color:var(--text-1)}
  .badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:inline-grid;place-items:center;box-shadow:0 0 14px rgba(226,85,43,.6)}
  .me{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--me-a),var(--me-b));border:1px solid var(--border);display:grid;place-items:center;font-size:12px;flex-shrink:0}
  .mode{display:flex;align-items:center;gap:var(--sp-2);font-size:12px;color:var(--text-3)}
  .mode .seg button{font-size:12px;padding:4px 10px}
  /* 演示控件：顶栏统一后放在顶栏下面一条 */
  .mode-m{display:flex;justify-content:flex-end;align-items:center;gap:var(--sp-2);flex-wrap:wrap;margin:12px 20px 0}
  .mode-m::before{content:"演示";font-size:12px;color:var(--text-3);margin-right:4px}

  /* ---------- 画面 ---------- */
  main{position:relative;max-width:1400px;margin:0 auto;padding:var(--sp-6) 24px 64px;overflow-x:clip}
  #wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:1}
  #wires path{fill:none}
  #wires .base{stroke-width:1.2;opacity:.42;transition:opacity var(--t-panel),stroke-width var(--t-panel)}
  #wires .base.off{stroke-dasharray:2 6;opacity:.32}
  #wires .base.draw{animation:draw var(--t-slow) var(--ease) both}
  @keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
  /* 流光：一颗彗星（亮头 + 渐隐的尾巴）沿线匀速跑，长线跑得久，短线跑得快 */
  #wires .comet{fill:none;stroke-linecap:round;opacity:0;transition:opacity var(--t-number) var(--t-enter);animation:comet var(--dur) linear var(--dl) infinite}
  body.ready #wires .comet{opacity:1}
  #wires .comet.t{stroke-width:2.6;stroke-opacity:.16}
  #wires .comet.m{stroke-width:2.2;stroke-opacity:.5}
  #wires .comet.h{stroke-width:3;filter:url(#soft)}
  @keyframes comet{from{stroke-dashoffset:var(--o)}to{stroke-dashoffset:calc(var(--o) - var(--P))}}
  #wires .base.hl{opacity:.95!important;stroke-width:1.8}
  #wires text{font:12px -apple-system,"PingFang SC",sans-serif;fill:var(--text-3)}
  
  .center{position:relative;z-index:2;display:flex;justify-content:center}
  [data-node]{cursor:pointer}

  /* 你喜欢的那块：小灰字标签 + 大数字 + 绿色对比，整页统一用它 */
  .kpi{min-width:0}
  .kpi .l{font-size:13px;color:var(--text-2);white-space:nowrap}
  .kpi .v{font-size:32px;font-weight:600;line-height:1.15;white-space:nowrap;letter-spacing:-.01em}
  .kpi .v small{font-size:15px;font-weight:500;color:var(--text-2);margin-right:4px;letter-spacing:0}
  .kpi .d{font-size:13px;color:var(--text-2);white-space:nowrap}
  .kpi svg{display:block;width:100%;max-width:200px;height:26px;margin-top:4px}
  .kpi.sm .l{font-size:12px} .kpi.sm .v{font-size:21px} .kpi.sm .v small{font-size:12px} .kpi.sm .d{font-size:12px} .kpi.sm svg{height:18px;max-width:110px}

  /* ① 本周生意：整页的根，总数只出现在这里 */
  .root{--c:var(--brand);position:relative;display:grid;grid-template-columns:auto repeat(3,minmax(150px,auto)) auto;align-items:center;gap:var(--sp-6);
    padding:var(--sp-4) var(--sp-5);border-radius:var(--r-pop);background:linear-gradient(180deg,rgb(var(--rgb-panel) / .82),rgb(var(--rgb-panel) / .82));
    border:1px solid rgba(242,181,68,.22);box-shadow:0 20px 60px rgba(0,0,0,.35),0 0 60px rgba(242,181,68,.06),inset 0 1px 0 rgb(var(--rgb-tint) / .06);
    backdrop-filter:blur(10px);transition:border-color var(--t-panel),box-shadow var(--t-panel)}
  .root:hover,.root.sel{border-color:rgba(242,181,68,.5);box-shadow:0 20px 60px rgba(0,0,0,.4),0 0 70px rgba(242,181,68,.12),inset 0 1px 0 rgb(var(--rgb-tint) / .06)}
  .root .ttl{font-size:12px;color:var(--text-3);line-height:1.6;white-space:nowrap}
  .root .ttl b{display:block;font-size:17px;color:var(--text-1);font-weight:600;letter-spacing:.04em}
  .root .kpi+.kpi{padding-left:var(--sp-6);border-left:1px solid rgb(var(--rgb-tint) / .07)}
  .wait{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;font-weight:700;white-space:nowrap;
    background:linear-gradient(135deg,#E2552B,var(--accent));color:#fff;box-shadow:0 8px 24px rgba(194,65,12,.4);animation:glow 2.6s ease-in-out infinite}
  .wait b{font-size:20px;line-height:1}
  @keyframes glow{50%{box-shadow:0 8px 34px rgba(226,85,43,.65)}}

  /* ② 小巡：一条播报 */
  .ceo{position:relative;z-index:2;width:100%;max-width:980px;padding:var(--sp-4) var(--sp-5);border-radius:var(--r-pop);
    background:linear-gradient(180deg,rgb(var(--rgb-panel) / .84),rgb(var(--rgb-panel) / .84));border:1px solid rgba(242,181,68,.24);
    box-shadow:0 20px 60px rgba(0,0,0,.35),0 0 60px rgba(242,181,68,.06),inset 0 1px 0 rgb(var(--rgb-tint) / .06);transition:border-color var(--t-panel),box-shadow var(--t-panel)}
  .ceo-h{display:flex;align-items:center;gap:var(--sp-3)}
  .ceo-h .cn{font-weight:600;font-size:16px;display:flex;align-items:baseline;gap:8px}
  .ceo-h .cn small{font-size:12px;font-weight:400;color:var(--text-3)}
  .per{margin-left:auto}
  .per button{font-size:12px;padding:4px 12px}
  .ceo-k{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-6);margin:var(--sp-4) 0 var(--sp-3)}
  .ceo-k .kpi+.kpi{padding-left:var(--sp-6);border-left:1px solid rgb(var(--rgb-tint) / .07)}
  .ceo-f{display:flex;align-items:center;gap:var(--sp-3);padding-top:var(--sp-3);border-top:1px solid rgb(var(--rgb-tint) / .06)}
  .ceo-f .say{flex:1;min-width:0}
  .boss{--c:var(--brand);position:relative;display:flex;align-items:center;gap:var(--sp-3);padding:10px 12px 10px 10px;border-radius:99px;
    background:rgb(var(--rgb-panel) / .88);border:1px solid rgba(242,181,68,.3);box-shadow:0 12px 40px rgba(0,0,0,.35),0 0 40px rgba(242,181,68,.08);transition:border-color var(--t-panel),box-shadow var(--t-panel)}
  .boss:hover,.boss.sel{border-color:rgba(242,181,68,.6);box-shadow:0 12px 40px rgba(0,0,0,.4),0 0 50px rgba(242,181,68,.14)}
  .boss .face{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#1B1305;flex-shrink:0;
    background:linear-gradient(135deg,var(--brand-fill-hi),var(--brand-fill-lo));box-shadow:0 0 0 3px rgba(242,181,68,.18),0 0 24px rgba(242,181,68,.35)}
  .boss .bn{font-weight:600;font-size:16px}
  .boss .bn small{font-size:12px;font-weight:400;color:var(--text-3);margin-left:4px}
  .boss .bs{font-size:12px;color:var(--text-2)}
  .boss .bs b{color:var(--text-1)}
  .boss .wait{margin-left:var(--sp-5);border-radius:99px;padding:9px 16px}
    background:rgb(var(--rgb-panel) / .85);border:1px solid rgba(242,181,68,.2);box-shadow:0 10px 40px rgba(0,0,0,.3),0 0 50px rgba(242,181,68,.08);transition:border-color var(--t-panel)}
  .ceo:hover,.ceo.sel{border-color:rgba(242,181,68,.5)}
  .ceo::before{content:"";position:absolute;inset:-30px -60px;z-index:-1;border-radius:50%;background:radial-gradient(closest-side,rgba(242,181,68,.1),transparent);pointer-events:none}
  .radar{width:36px;height:36px;flex-shrink:0;border-radius:50%;position:relative;overflow:hidden;border:1px solid rgba(242,181,68,.4);background:rgba(242,181,68,.06)}
  .radar::before{content:"";position:absolute;inset:0;background:conic-gradient(rgba(250,203,131,.65),transparent 26%);animation:spin 4s linear infinite}
  .radar::after{content:"";position:absolute;inset:38%;border-radius:50%;background:var(--brand-hi);box-shadow:0 0 8px var(--brand)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ceo .who{font-size:12px;color:var(--brand-hi);white-space:nowrap}
  .ceo .say{font-size:14px;color:var(--text-1);line-height:1.5}
  .ceo .say b{color:var(--brand-hi);font-weight:600}
  .ceo-wrap{margin-top:60px}
  .ceo .more{font-size:12px;color:var(--text-3);white-space:nowrap;margin-left:auto;padding-left:var(--sp-3)}

  /* 背景点阵：只在画面中间隐约可见，给一点「控制台」的质感 */
  main::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
    background-image:radial-gradient(rgb(var(--rgb-warm) / .08) 1px,transparent 1.3px);background-size:28px 28px;
    -webkit-mask-image:radial-gradient(55% 45% at 50% 55%,#000 30%,transparent 100%);mask-image:radial-gradient(55% 45% at 50% 55%,#000 30%,transparent 100%)}

  /* ③ 中心：主角是跨境电商中心，两侧没接入的收窄 */
  .centers{position:relative;z-index:2;display:grid;grid-template-columns:minmax(150px,200px) minmax(0,1fr) minmax(150px,200px);gap:var(--sp-6);margin-top:72px;align-items:start}
  .hub{--c:var(--off);position:relative;display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);border-radius:var(--r-card);
    background:rgb(var(--rgb-panel) / .82);border:1px solid color-mix(in srgb,var(--c) 30%,transparent);transition:border-color var(--t-panel),translate var(--t-panel) var(--ease),box-shadow var(--t-panel)}
  .hub:hover,.hub.sel,.hub.hl{translate:0 -2px;border-color:color-mix(in srgb,var(--c) 70%,transparent);box-shadow:0 0 30px color-mix(in srgb,var(--c) 14%,transparent)}
  .ico{width:30px;height:30px;flex-shrink:0;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);font-weight:700;font-size:14px}
  .hub .n{font-weight:600;font-size:15px;white-space:nowrap}
  .hub .m{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:6px;white-space:nowrap}
  .hub .m img{width:18px;height:18px;object-fit:contain}
  .hub .st{margin-left:auto;font-size:12px;white-space:nowrap;display:flex;align-items:center;gap:6px;color:var(--text-2)}
  .live{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 2s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .hub.off{background:transparent;border-style:dashed}
  .hub.off .n{color:var(--text-2)}
  .side .hub{flex-wrap:wrap;row-gap:6px;margin-top:22px}
  .side .hub .st{margin-left:42px;width:100%}
  .side .hub.off{opacity:.75} .side .hub.off:hover{opacity:1}

  /* 中心面板：中心 + AI 员工流水线 + 成员，一整块 */
  .dept{position:relative;padding:var(--sp-5) var(--sp-5) var(--sp-4);border-radius:var(--r-pop);
    background:linear-gradient(180deg,rgba(242,181,68,.07),rgb(var(--rgb-panel) / .78) 26%,rgb(var(--rgb-deep) / .82));
    border:1px solid rgba(242,181,68,.24);box-shadow:0 30px 80px rgba(0,0,0,.38),0 0 80px rgba(242,181,68,.06),inset 0 1px 0 rgb(var(--rgb-tint) / .06);transition:border-color var(--t-panel),box-shadow var(--t-panel)}
  .dept::before{content:"";position:absolute;left:18%;right:18%;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--brand-fill-hi),transparent);opacity:.8}
  .dept:has(.hub.sel),.dept:has(.hub:hover){border-color:rgba(242,181,68,.45);box-shadow:0 30px 80px rgba(0,0,0,.4),0 0 90px rgba(242,181,68,.1),inset 0 1px 0 rgb(var(--rgb-tint) / .06)}
  .dept > .hub{padding:0;background:none;border:0;box-shadow:none!important;translate:none!important}
  .dept > .hub::after{display:none}
  .dept > .hub .ico{width:42px;height:42px;border-radius:12px;font-size:17px;box-shadow:0 0 24px color-mix(in srgb,var(--c) 30%,transparent),inset 0 0 0 1px color-mix(in srgb,var(--c) 35%,transparent)}
  .dept > .hub .n{font-size:18px;letter-spacing:.04em}
  .lane-h{display:flex;align-items:center;gap:var(--sp-3);margin:var(--sp-5) 0 var(--sp-2);font-size:12px;color:var(--text-3)}
  .lane-h b{color:var(--text-2);font-weight:500}
  .lane-h .flowtxt{margin-left:auto;letter-spacing:.06em}
  .lane-h .flowtxt i{font-style:normal;color:var(--brand);margin:0 4px;opacity:.7}

  /* AI 员工流水线：一条金色导轨串起业务流程（小导在最前，虚线：带新人、答疑） */
  .dept .flow{--n:6;position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px;padding:4px 0 2px}
  .flow .rail,.flow .rail-g{position:absolute;top:38px;height:2px;border-radius:2px;pointer-events:none}
  .flow .rail{left:calc(100% / var(--n) * 1.5);right:calc(100% / var(--n) * .5);background:linear-gradient(90deg,rgba(242,181,68,.25),rgba(242,181,68,.7) 50%,rgba(242,181,68,.25));box-shadow:0 0 12px rgba(242,181,68,.25)}
  .flow .rail-g{left:calc(100% / var(--n) * .5);width:calc(100% / var(--n));height:0;border-top:2px dashed rgba(242,181,68,.35)}
  .flow .rail i{position:absolute;top:-3px;left:0;width:60px;height:8px;margin-left:-60px;border-radius:8px;
    background:linear-gradient(90deg,transparent,rgba(255,226,160,.95));filter:blur(.5px);box-shadow:0 0 14px rgba(250,203,131,.8);opacity:0;animation:railrun 6.5s cubic-bezier(.45,.05,.55,.95) 1.6s infinite}
  @keyframes railrun{0%{left:0;opacity:0}8%{opacity:1}88%{opacity:1}100%{left:100%;opacity:0}}
  .flow .worker{flex-direction:column;align-items:center;text-align:center;gap:6px;padding:6px 6px 10px;background:none;border:1px solid transparent;border-radius:14px}
  .flow .worker:hover,.flow .worker.sel{background:rgb(var(--rgb-tint) / .035);border-color:rgba(242,181,68,.3)}
  .flow .worker img{position:relative;z-index:1;width:68px;height:68px;padding:6px;border-radius:50%;object-fit:contain;
    background:radial-gradient(circle at 50% 70%,rgba(242,181,68,.2),rgb(var(--rgb-deep) / .98) 68%);
    box-shadow:0 0 0 1px rgba(242,181,68,.28),0 0 0 5px rgb(var(--rgb-deep) / .9),0 10px 24px rgba(0,0,0,.45);filter:none}
  .flow .worker.guide img{box-shadow:0 0 0 1px rgba(242,181,68,.22),0 0 0 5px rgb(var(--rgb-deep) / .9),0 10px 24px rgba(0,0,0,.45)}
  .flow .worker .wb{width:100%}
  .flow .worker .wn{justify-content:center;font-size:14px}
  .flow .worker .wn .muted{display:none}
  .flow .worker .wr{font-size:11px;color:var(--brand-hi);letter-spacing:.08em;opacity:.85}
  .flow .worker .wt{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em;line-height:1.45;margin-top:4px;font-size:11.5px}
  .flow .worker .pg{width:72%;margin:8px auto 0}
  .flow .worker.busy img{animation:none}
  .flow .worker.busy:hover img{animation:bob 1.8s ease-in-out infinite}

  // ================= 主画面 =================

  // ================= 连线 =================
  const PARENT = {ceo:'root', 'c-media':'ceo', 'c-commerce':'ceo', 'c-web':'ceo', 's-0':'c-commerce', 's-1':'c-commerce', 's-2':'c-commerce', 's-3':'c-commerce',

  function counts(){
    $$('.js-badge').forEach(b => b.textContent = TODO().length); $('#wait-n').textContent = TODO().length;
    if ($('#dec-n')) $('#dec-n').textContent = DECIDED().length;
  }
  // 决策层在页面上批准一件事并定跟进人：绿点从决策层经 小巡送到跟进人，跟进人的状态跟着变
  function assign(t, ownerText){
    const owner = ownerText.split(' · ')[0], how = ownerText.split(' · ')[1] || '跟进';
    const ownerId = {张三:'m-zs', 李四:'m-ls', 赵六:'m-zl', 王五:'m-ww', 小投:'ai-xiaotou', 小测:'ai-xiaoce', 小补:'ai-xiaobu'}[owner] || 'ai-xiaotou';
    const now = new Date(Date.now() + (3*60 + new Date().getTimezoneOffset())*60000);
    assigned.push({id:t.id, t:t.did || t.t, owner, ownerId, how, time:`${pad(saHour())}:${pad(now.getMinutes())}`});
    close();
    const a = box($('#root')), c = box($('#ceo')), el = document.getElementById(ownerId), e = box(el);
    fly(`M${a.cx},${a.b} L${c.cx},${c.t} L${c.cx},${c.b} C${c.cx},${c.b + 40} ${e.cx},${e.t - 40} ${e.cx},${e.t}`, getComputedStyle(document.documentElement).getPropertyValue('--ok'), 1300, () => {
      if (el.classList.contains('member')) el.querySelector('.wt').textContent = memberNow(D.team.find(m => m.id === ownerId));
      el.classList.remove('ack'); void el.offsetWidth; el.classList.add('ack');
      if (t.focus) $$(`.todo[data-focus="${t.focus}"]`).forEach(li => { li.style.setProperty('--k', 'var(--ok)'); li.classList.remove('urgent');
        const sEl = li.querySelector('.s'); if (sEl) sEl.textContent = `${owner}${ownerId.startsWith('m-') ? '跟进中' : '执行中'}`; });
      counts();
    }, 5);
  }
  $$('.sim').forEach(b => b.onclick = () => urgent ? calm() : raise());
  function showToast(){
    const h = saHour();
    $('#toast').innerHTML = `<div class="tw-h"><span class="app">企</span>企业微信 · 小巡<span class="tm">${pad(h)}:02</span><button class="tw-x" aria-label="关闭">✕</button></div>
      <div class="tw-b"><div class="tt"><span>紧急</span>云屿商店 · 沙特一个广告组在烧钱</div>
        <p>「SP-水杯-广泛」最近 2 小时花了 SAR 150（日预算的 80%），0 单。小投建议先暂停（它就在等你拍板的 4 条里，先止损）。张三也收到了，你们谁先批都算；批准后马上通过 noon 接口执行。</p>
        <div class="bs"><button class="btn main" id="tw-ok">批准暂停</button><button class="btn" id="tw-open">先看看</button></div></div>`;
    $('#toast').classList.add('show');
    $('#toast .tw-x').onclick = hideToast;
    $('#tw-open').onclick = () => { hideToast(); open('s-0', 'ads'); };
    $('#tw-ok').onclick = () => { $('#toast .tw-b').innerHTML = '<div class="tt" style="color:var(--ok)">已批准</div><p>小投正在通过 noon 接口暂停「SP-水杯-广泛」，生效后会再告诉你。</p>'; setTimeout(hideToast, 2200); approve(); };
  }
  function hideToast(){ $('#toast').classList.remove('show'); }

  // 大数字从 0 滚到目标值（600ms），保留千分位、小数和「万」
  function countUp(){
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;   // 减少动态效果：直接显示最终数字
    $$('.kpi .v').forEach(el => {
      const node = [...el.childNodes].reverse().find(n => n.nodeType === 3 && /\d/.test(n.textContent)); if (!node) return;
      const txt = node.textContent.trim(), m = txt.match(/^([+-]?)([\d,]*\.?\d+)(.*)$/); if (!m) return;
      const target = parseFloat(m[2].replace(/,/g, '')), dec = (m[2].split('.')[1] || '').length, comma = m[2].includes(','), t0 = performance.now();
      const fmt = v => { let s = v.toFixed(dec); if (comma) s = Number(s).toLocaleString('en-US', {minimumFractionDigits:dec, maximumFractionDigits:dec}); return m[1] + s + m[3]; };
      (function step(now){ const u = Math.min(1, (now - t0) / 600), e = 1 - Math.pow(1 - u, 3); node.textContent = fmt(target * e); if (u < 1) requestAnimationFrame(step); })(t0);
    });
  }
  // 跟手光
  addEventListener('pointermove', e => {
    const el = e.target.closest?.('.boss,.hub,.store,.worker,.member,.ceo'); if (!el) return;
    const b = el.getBoundingClientRect(); el.style.setProperty('--mx', (e.clientX - b.left) + 'px'); el.style.setProperty('--my', (e.clientY - b.top) + 'px');
  });
  // 播报换内容时从左往右展开
  function say(){ const el = $('#ceo-say'); el.innerHTML = ceoSay(); el.classList.remove('reveal'); void el.offsetWidth; el.classList.add('reveal'); $('#ceo-who').textContent = ceoWho(); }

  $('#drawer .x').onclick = close; $('#scrim').onclick = close;
  addEventListener('keydown', e => e.key === 'Escape' && close());
  addEventListener('resize', () => draw(false));
  render();
</script>
