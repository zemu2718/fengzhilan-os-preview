<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="img/logo-icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
<title>风之岚 OS · UI 预览</title>
<!-- UI 确认总入口：所有高保真原型页，按决策层一天的使用顺序排。页面全部确认后再开始写代码。 -->
<link rel="stylesheet" href="assets/tokens.css">
<script src="assets/theme.js"></script>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/components.css">
<link rel="stylesheet" href="assets/topbar.css">
<style>
  body{background:radial-gradient(60% 40% at 80% 0%,rgba(242,181,68,.08),transparent 70%),var(--bg-0)}
  .wrap{max-width:1180px;margin:0 auto;padding:var(--sp-7) var(--sp-5)}
  .hd{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:var(--sp-6);align-items:end;margin-bottom:var(--sp-6)}
  .hd h1{font-family:var(--font-serif);font-size:var(--fs-32);letter-spacing:.04em}
  .hd p{color:var(--text-2);margin-top:var(--sp-2);line-height:var(--lh-loose);max-width:62ch}
  .hd img{width:100%;border-radius:var(--r-pop);border:1px solid var(--divider)}
  .loop{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:var(--sp-4) 0 var(--sp-6);font-size:var(--fs-13);color:var(--text-2)}
  .loop b{padding:6px 12px;border-radius:var(--r-pill);background:var(--surface-2);font-weight:500;color:var(--text-1)}
  .grp{margin-bottom:var(--sp-6)}
  .grp > h2{font-size:var(--fs-16);margin-bottom:var(--sp-3);color:var(--text-2);font-weight:500}
  .pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--sp-3)}
  .pg{display:flex;flex-direction:column;gap:6px;padding:var(--sp-4);border-radius:var(--r-card);background:var(--surface-1);border:1px solid var(--divider);transition:border-color var(--t-hover),transform var(--t-hover)}
  .pg:hover{border-color:color-mix(in srgb,var(--brand) 45%,transparent);transform:translateY(-2px)}
  .pg .n{font-family:var(--font-mono);font-size:var(--fs-12);color:var(--text-3)}
  .pg b{font-size:var(--fs-16)}
  .pg p{font-size:var(--fs-13);color:var(--text-2);line-height:var(--lh)}
  .pg .alt{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:6px;font-size:var(--fs-12)}
  .pg .alt a{color:var(--brand-hi)}
  .pg.new{border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
  .pg.new .n::after{content:"11-20 新增";margin-left:8px;color:var(--ok);font-family:var(--font-sans)}
  .todo li{margin:8px 0;color:var(--text-2);line-height:var(--lh-loose)}
  .todo b{color:var(--text-1);font-weight:500}
  @media (max-width:767px){ .hd{grid-template-columns:minmax(0,1fr)} .wrap{padding:var(--sp-6) 16px} }
</style>
</head>
<body>
<div class="wrap">
  <header class="hd"><div><h1>风之岚 OS · UI 预览</h1>
    <p>从下方选择页面，体验组织树、地图和 AI 员工工作台。店名为虚构名称，经营数字均为演示数据。</p></div>
    <img src="img/hero-commerce.webp" alt=""></header>

  <div class="loop"><b>每日巡检 15:00</b>→<b>小投 · 小补 · 小测出建议</b>→<b>运营初审</b>→<b>拍板人拍板，定跟进人</b>→<b>AI 员工通过接口执行 / 成员跟进</b>→<b>小巡每小时巡查</b>→<b>15:10 日报</b></div>

  <div id="groups"></div>

</div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
